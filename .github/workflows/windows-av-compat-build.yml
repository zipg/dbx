name: Windows AV Compatibility Build

on:
  push:
    branches:
      - codex/windows-av-compat-startup
  workflow_dispatch:
    inputs:
      build_label:
        description: "Label appended to artifact names"
        required: false
        default: "avcompat"
      ref:
        description: "Optional ref to build (branch/tag/sha); defaults to the dispatch ref"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # Fast feedback on every push: type-check the whole Windows Tauri app and run
  # the startup compatibility ladder unit tests. No bundling, no artifacts.
  compile-check:
    name: Windows compile check + startup unit tests
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      - name: Show build revision
        shell: pwsh
        run: |
          git rev-parse HEAD
          git log -1 --format='%H %s'

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      - name: Build frontend
        run: pnpm build

      - name: Cargo check (Windows x64)
        run: cargo check -p dbx --target x86_64-pc-windows-msvc --locked
        timeout-minutes: 30

      # Guardrail: compile and run the pure startup ladder tests on Windows.
      # The test harness needs a full debug codegen of the workspace (~12+ min
      # cold) and timed out on every release build, delaying the installer jobs
      # without producing results — so run it only on manual dispatch.
      - name: Startup recovery unit tests (Windows x64)
        if: github.event_name == 'workflow_dispatch'
        run: cargo test -p dbx --lib --target x86_64-pc-windows-msvc --locked -- startup_recovery
        timeout-minutes: 30
        continue-on-error: true

  # Full unsigned NSIS installer + portable zip. Only for explicit release
  # builds: manual dispatch, or a push whose commit message contains the
  # literal marker [release-build].
  windows-installer:
    name: Windows x64 NSIS installer + portable
    needs: compile-check
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-build]')
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C debuginfo=line-tables-only"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      - name: Show build revision
        shell: pwsh
        run: |
          git rev-parse HEAD
          git log -1 --format='%H %s'

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      - name: Build frontend
        run: pnpm build

      - name: Build unsigned Windows x64 installer
        shell: pwsh
        run: |
          pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.av-test.conf.json --ci

      - name: Collect installer, portable build, collector script and checksums
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $label = "${{ inputs.build_label }}"
          if ([string]::IsNullOrWhiteSpace($label)) { $label = "avcompat" }
          $bundleDir = "target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $installer = Get-ChildItem $bundleDir -Filter "*.exe" | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if (!$installer) { throw "Missing NSIS installer in ${bundleDir}" }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $installerName = "DBX_${version}_${label}_x64-setup.exe"
          Copy-Item $installer.FullName (Join-Path artifacts $installerName)

          # Ship the standalone client log collector with the Windows test package.
          $collectorScript = "scripts/collect-dbx-startup-logs.ps1"
          if (Test-Path -LiteralPath $collectorScript) {
            Copy-Item -LiteralPath $collectorScript -Destination (Join-Path artifacts "collect-dbx-startup-logs.ps1") -Force
            Write-Host "Included client log collector: collect-dbx-startup-logs.ps1"
          } else {
            Write-Warning "scripts/collect-dbx-startup-logs.ps1 is missing from the checkout; artifact will not contain the client log collector."
          }

          $portableDir = Join-Path $env:RUNNER_TEMP "DBX-portable"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          $releaseDir = "target/x86_64-pc-windows-msvc/release"
          Copy-Item (Join-Path $releaseDir "dbx.exe") (Join-Path $portableDir "DBX.exe") -Force
          Get-ChildItem $releaseDir -Filter "WebView2Loader.dll" | ForEach-Object { Copy-Item $_.FullName $portableDir }
          Copy-Item LICENSE (Join-Path $portableDir "LICENSE") -Force
          Copy-Item README.md (Join-Path $portableDir "README.md") -Force
          Set-Content -Path (Join-Path $portableDir "portable.dbx") -Value "" -NoNewline
          $portableZip = Join-Path artifacts "DBX_${version}_${label}_x64-portable.zip"
          Compress-Archive -Path (Join-Path $portableDir "*") -DestinationPath $portableZip -Force

          $hash = Get-FileHash (Join-Path artifacts $installerName) -Algorithm SHA256
          $portableHash = Get-FileHash $portableZip -Algorithm SHA256
          @(
            "$($hash.Hash.ToLower())  $installerName",
            "$($portableHash.Hash.ToLower())  DBX_${version}_${label}_x64-portable.zip"
          ) | Set-Content artifacts/SHA256SUMS.txt

          @"
          DBX Windows x64 AV-compatibility test package (unsigned)
          Repository: ${{ github.repository }}
          Commit: ${{ github.sha }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Version: $version
          Label: $label
          Installer: unsigned NSIS setup (createUpdaterArtifacts disabled for this test build)
          Portable: DBX.exe + portable.dbx marker (portable data mode)
          Client log collector: collect-dbx-startup-logs.ps1 (run on the affected Windows machine after reproducing the startup failure)
          Application SHA256: $((Get-FileHash (Join-Path $releaseDir 'dbx.exe') -Algorithm SHA256).Hash.ToLower())
          "@ | Set-Content artifacts/BUILD-INFO.txt

      - name: Upload Windows AV-compat artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DBX-windows-x64-${{ inputs.build_label || 'avcompat' }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  # Proper fix for machines where the Evergreen WebView2 runtime is missing:
  # the default installer mode (downloadBootstrapper) needs internet at install
  # time, so an offline/air-gapped or AV-blocked machine ends up without
  # WebView2 and DBX can never create a window (which the startup watchdog used
  # to misreport as a security-product block). offlineInstaller embeds the
  # Microsoft Evergreen standalone installer (~127 MB) and installs it silently.
  windows-installer-offline:
    name: Windows x64 NSIS installer (WebView2 offline installer embedded)
    needs: compile-check
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-build]')
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C debuginfo=line-tables-only"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      - name: Show build revision
        shell: pwsh
        run: |
          git rev-parse HEAD
          git log -1 --format='%H %s'

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      - name: Build frontend
        run: pnpm build

      - name: Build unsigned Windows x64 installer (WebView2 offline installer embedded)
        shell: pwsh
        run: |
          pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.offline-test.conf.json --ci

      - name: Collect WebView2-offline installer and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $bundleDir = "target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $installer = Get-ChildItem $bundleDir -Filter "*.exe" | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if (!$installer) { throw "Missing NSIS installer in ${bundleDir}" }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $installerName = "DBX_${version}_avcompat-offline_x64-setup.exe"
          Copy-Item $installer.FullName (Join-Path artifacts $installerName)

          $collectorScript = "scripts/collect-dbx-startup-logs.ps1"
          if (Test-Path -LiteralPath $collectorScript) {
            Copy-Item -LiteralPath $collectorScript -Destination (Join-Path artifacts "collect-dbx-startup-logs.ps1") -Force
            Write-Host "Included client log collector: collect-dbx-startup-logs.ps1"
          } else {
            Write-Warning "scripts/collect-dbx-startup-logs.ps1 is missing from the checkout; artifact will not contain the client log collector."
          }

          $hash = Get-FileHash (Join-Path artifacts $installerName) -Algorithm SHA256
          "$($hash.Hash.ToLower())  $installerName" | Set-Content artifacts/SHA256SUMS.txt

          $releaseDir = "target/x86_64-pc-windows-msvc/release"
          @"
          DBX Windows x64 AV-compatibility test package (unsigned, WebView2 offline installer embedded)
          Repository: ${{ github.repository }}
          Commit: ${{ github.sha }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Version: $version
          Label: avcompat-offline
          Installer: unsigned NSIS setup (createUpdaterArtifacts disabled for this test build)
          WebView2 install mode: offlineInstaller (Microsoft Evergreen standalone installer embedded; no internet required)
          Client log collector: collect-dbx-startup-logs.ps1 (run on the affected Windows machine after reproducing the startup failure)
          Application SHA256: $((Get-FileHash (Join-Path $releaseDir 'dbx.exe') -Algorithm SHA256).Hash.ToLower())
          "@ | Set-Content artifacts/BUILD-INFO.txt

      - name: Upload WebView2-offline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DBX-windows-x64-avcompat-offline
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  # Alternative fix candidate for the affected Windows 10 + 360 安全卫士 client:
  # bundle a modern WebView2 fixed runtime (133.0.3065.92 x64) instead of relying
  # on the machine's Evergreen runtime. Tauri sets WEBVIEW2_BROWSER_EXECUTABLE_FOLDER
  # for fixed-runtime bundles and the vendored wry patch honors it on Windows.
  windows-installer-fixed-runtime:
    name: Windows x64 NSIS installer (fixed WebView2 ${{ matrix.version }})
    needs: compile-check
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-build]')
    runs-on: windows-2022
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 133.0.3065.92
            label: avcompat-fixed133
            note: "modern runtime; RendererCodeIntegrity cannot be disabled (always on since 118)"
          - version: 117.0.2045.60
            label: avcompat-fixed117
            note: "older runtime; last major branch where RendererCodeIntegrity can be disabled (startup ladder profile 2)"
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C debuginfo=line-tables-only"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      - name: Show build revision
        shell: pwsh
        run: |
          git rev-parse HEAD
          git log -1 --format='%H %s'

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      - name: Download WebView2 fixed runtime 133.0.3065.92 (x64)
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ matrix.version }}'
          $cabName = "Microsoft.WebView2.FixedVersionRuntime.$version.x64.cab"
          $url = "https://github.com/westinyang/WebView2RuntimeArchive/releases/download/$version/$cabName"
          $cab = Join-Path $env:RUNNER_TEMP $cabName
          if (!(Test-Path -LiteralPath $cab)) {
            Invoke-WebRequest -Uri $url -OutFile $cab -MaximumRetryCount 3 -RetryIntervalSec 5
          }

          # Supply-chain check: the official fixed-runtime CAB is distributed by
          # Microsoft. Edge update CABs are normally catalog-signed rather than
          # embedded-Authenticode-signed, so accept either a valid Microsoft
          # signature on the CAB itself, or (fallback) a valid Microsoft
          # Authenticode signature on the extracted msedgewebview2.exe below.
          $cabSignature = $null
          try { $cabSignature = Get-AuthenticodeSignature -FilePath $cab -ErrorAction Stop } catch {
            Write-Warning "Unable to read Authenticode signature of the cab: $($_.Exception.Message)"
          }
          $cabSignedByMicrosoft = $false
          if ($null -ne $cabSignature -and
              $cabSignature.Status -eq [System.Management.Automation.SignatureStatus]::Valid -and
              $null -ne $cabSignature.SignerCertificate -and
              $cabSignature.SignerCertificate.Subject -match 'Microsoft Corporation') {
            $cabSignedByMicrosoft = $true
          }
          $hash = (Get-FileHash -LiteralPath $cab -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "fixed runtime cab sha256=$hash bytes=$((Get-Item -LiteralPath $cab).Length)"

          $extract = Join-Path $env:RUNNER_TEMP 'wv2-fixed'
          Remove-Item -LiteralPath $extract -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          & "$env:SystemRoot\System32\expand.exe" $cab '-F:*' $extract
          if ($LASTEXITCODE -ne 0) { throw "expand.exe failed ($LASTEXITCODE)" }

          $runtime = Join-Path $extract "Microsoft.WebView2.FixedVersionRuntime.$version.x64"
          if (!(Test-Path -LiteralPath (Join-Path $runtime 'msedgewebview2.exe'))) {
            $found = Get-ChildItem -LiteralPath $extract -Recurse -Filter 'msedgewebview2.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $runtime = $found.Directory.FullName } else { throw "fixed runtime is missing msedgewebview2.exe after extraction" }
          }

          $runtimeExe = Join-Path $runtime 'msedgewebview2.exe'
          $exeSignature = Get-AuthenticodeSignature -FilePath $runtimeExe -ErrorAction Stop
          if ($exeSignature.Status -ne [System.Management.Automation.SignatureStatus]::Valid -or
              $null -eq $exeSignature.SignerCertificate -or
              $exeSignature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') {
            throw "Extracted msedgewebview2.exe is not Microsoft-signed (status=$($exeSignature.Status))."
          }
          if (-not $cabSignedByMicrosoft) {
            Write-Warning "Cab has no embedded Microsoft Authenticode signature (official Edge CABs are catalog-signed); validated the Microsoft signature on the extracted msedgewebview2.exe instead."
          }
          Write-Host "fixed runtime msedgewebview2.exe signer=$($exeSignature.SignerCertificate.Subject)"

          $target = 'src-tauri/webview2-fixed-runtime'
          Remove-Item -LiteralPath $target -Recurse -Force -ErrorAction SilentlyContinue
          Move-Item -LiteralPath $runtime -Destination $target
          $runtimeFiles = @(Get-ChildItem -LiteralPath $target -Recurse -File)
          $runtimeBytes = ($runtimeFiles | Measure-Object Length -Sum).Sum
          $runtimeSummary = "$($runtimeFiles.Count) files, $([math]::Round($runtimeBytes / 1MB, 1)) MB"
          Write-Host "runtime files: $runtimeSummary"
          "WV2_FIXED_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WV2_CAB_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WV2_RUNTIME_SUMMARY=$runtimeSummary" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build frontend
        run: pnpm build

      - name: Build unsigned Windows x64 installer (fixed WebView2 runtime)
        shell: pwsh
        run: |
          pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.fixed-runtime-test.conf.json --ci

      - name: Collect fixed-runtime installer and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $bundleDir = "target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $installer = Get-ChildItem $bundleDir -Filter "*.exe" | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if (!$installer) { throw "Missing NSIS installer in ${bundleDir}" }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $installerName = "DBX_${version}_${{ matrix.label }}_x64-setup.exe"
          Copy-Item $installer.FullName (Join-Path artifacts $installerName)

          $collectorScript = "scripts/collect-dbx-startup-logs.ps1"
          if (Test-Path -LiteralPath $collectorScript) {
            Copy-Item -LiteralPath $collectorScript -Destination (Join-Path artifacts "collect-dbx-startup-logs.ps1") -Force
            Write-Host "Included client log collector: collect-dbx-startup-logs.ps1"
          } else {
            Write-Warning "scripts/collect-dbx-startup-logs.ps1 is missing from the checkout; artifact will not contain the client log collector."
          }

          $hash = Get-FileHash (Join-Path artifacts $installerName) -Algorithm SHA256
          "$($hash.Hash.ToLower())  $installerName" | Set-Content artifacts/SHA256SUMS.txt

          $releaseDir = "target/x86_64-pc-windows-msvc/release"
          @"
          DBX Windows x64 AV-compatibility test package (unsigned, fixed WebView2 runtime)
          Repository: ${{ github.repository }}
          Commit: ${{ github.sha }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Version: $version
          Label: ${{ matrix.label }}
          WebView2 note: ${{ matrix.note }}
          Installer: unsigned NSIS setup (createUpdaterArtifacts disabled for this test build)
          WebView2 fixed runtime: $env:WV2_FIXED_VERSION (x64)
          WebView2 fixed runtime cab SHA256: $env:WV2_CAB_SHA256
          WebView2 fixed runtime files: $env:WV2_RUNTIME_SUMMARY
          Client log collector: collect-dbx-startup-logs.ps1 (run on the affected Windows machine after reproducing the startup failure)
          Application SHA256: $((Get-FileHash (Join-Path $releaseDir 'dbx.exe') -Algorithm SHA256).Hash.ToLower())
          "@ | Set-Content artifacts/BUILD-INFO.txt

      - name: Upload fixed-runtime artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DBX-windows-x64-${{ matrix.label }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
