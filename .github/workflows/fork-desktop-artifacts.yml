name: Fork Desktop Artifacts

on:
  push:
    branches:
      - codex/intel-webview-css-compat
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Compute Rust dependency hash
        id: deps-hash
        shell: bash
        run: |
          {
            find . -name Cargo.toml -not -path './target/*' -print0 \
              | sort -z \
              | xargs -0 sed -E '/^version = /d'
            grep -v '^version = ' Cargo.lock
          } | sha256sum | cut -d' ' -f1 | {
            read -r hash
            echo "hash=${hash:0:20}" >> "$GITHUB_OUTPUT"
          }

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"
          shared-key: fork-desktop-${{ matrix.target }}-${{ steps.deps-hash.outputs.hash }}
          add-rust-environment-hash-key: false
          cache-on-failure: true

      - name: Build macOS arm64 DMG
        if: matrix.name == 'macos-arm64'
        run: pnpm tauri build --bundles dmg --target ${{ matrix.target }} --ci --no-sign

      - name: Collect macOS artifacts
        if: matrix.name == 'macos-arm64'
        shell: bash
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/bundle/dmg/*.dmg artifacts/
          ls -lh artifacts

      - name: Build Windows x64 NSIS installer
        if: matrix.name == 'windows-x64'
        run: pnpm tauri build --bundles nsis --target ${{ matrix.target }} --ci --no-sign

      - name: Build Windows x64 WebView2 offline NSIS installer
        if: matrix.name == 'windows-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $bundleDir = "target/${{ matrix.target }}/release/bundle/nsis"
          $standard = Get-ChildItem $bundleDir -Filter "*.exe" |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if (!$standard) {
            Write-Error "Missing standard Windows installer in ${bundleDir}"
            exit 1
          }
          Copy-Item $standard.FullName (Join-Path artifacts ($standard.BaseName + "-standard" + $standard.Extension)) -Force

          $before = @{}
          Get-ChildItem $bundleDir -Filter "*.exe" | ForEach-Object { $before[$_.FullName] = $_.LastWriteTimeUtc }

          pnpm tauri bundle --bundles nsis --target ${{ matrix.target }} --config src-tauri/tauri.webview2-offline.conf.json --ci --no-sign

          $offline = Get-ChildItem $bundleDir -Filter "*.exe" |
            Where-Object { !$before.ContainsKey($_.FullName) -or $_.LastWriteTimeUtc -gt $before[$_.FullName] } |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if (!$offline) {
            Write-Error "Missing WebView2 offline installer in ${bundleDir}"
            exit 1
          }
          Copy-Item $offline.FullName (Join-Path artifacts ($offline.BaseName + "-webview2-offline" + $offline.Extension)) -Force
          Get-ChildItem artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dbx-${{ matrix.name }}-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7
