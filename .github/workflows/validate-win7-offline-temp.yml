name: Validate Windows 7 Offline Installer

on:
  push:
    branches:
      - codex/fix-webview2-offline-win7

jobs:
  build:
    runs-on: windows-2022
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-07-22
          components: rust-src

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"
          shared-key: validate-x86_64-win7-windows-msvc
          cache-on-failure: true

      - run: pnpm build

      - name: Build DBX for Windows 7
        run: cargo build --locked --package dbx --release --target x86_64-win7-windows-msvc -Z build-std=std,panic_abort

      - name: Prepare WebView2 109 offline runtime
        shell: pwsh
        run: ./.github/scripts/prepare-webview2-win7-runtime.ps1

      - name: Bundle Windows 7 offline installer
        shell: pwsh
        run: pnpm tauri bundle --bundles nsis --target x86_64-win7-windows-msvc --config src-tauri/tauri.webview2-win7-offline.conf.json

      - uses: actions/upload-artifact@v4
        with:
          name: dbx-win7-offline-test
          path: target/x86_64-win7-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
