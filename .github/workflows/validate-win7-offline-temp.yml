name: Win7 CSSColor4 visual evidence
on:
  push:
    branches: [codex/win7-csscolor4-evidence]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    if: github.repository == 'zipg/dbx'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/download-artifact@v5
        with:
          name: DBX-win7-CSSColor4-test
          run-id: 39098197448
          github-token: ${{ github.token }}
          path: package
      - name: Install existing tested package
        shell: pwsh
        run: |
          $installer = (Get-ChildItem package -Filter '*.exe' | Select-Object -First 1).FullName
          $root = Join-Path $env:RUNNER_TEMP 'dbx-csscolor4-evidence'
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$root") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Install failed: $($process.ExitCode)" }
          "DBX_EVIDENCE_ROOT=$root" >> $env:GITHUB_ENV
      - name: Render color samples using installed WebView2 109
        shell: pwsh
        run: node .github/scripts/win7-csscolor4-canary.mjs "$env:DBX_EVIDENCE_ROOT/dbx.exe" "$env:DBX_EVIDENCE_ROOT/webview2-fixed-runtime" evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Win7-CSSColor4-visual-evidence
          path: |
            evidence/*.png
            evidence/*.json
            evidence/*.txt
            evidence/*.log
          retention-days: 14
