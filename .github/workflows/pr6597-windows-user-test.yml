name: PR 6597 Windows User Test Build

on:
  push:
    branches:
      - codex/pr6597-windows-user-test

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"
          shared-key: pr6597-windows-x64
          cache-on-failure: true

      - name: Build Windows x64 installer
        run: pnpm tauri build --bundles nsis --target x86_64-pc-windows-msvc --ci --no-sign

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: DBX-PR6597-Windows-x64
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
