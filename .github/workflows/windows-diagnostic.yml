name: Windows Test Installer

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch, tag, or SHA to build"
        required: true
        default: "codex/fix-mysql-jdbc-tls"

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Windows NSIS installer
        env:
          CXXFLAGS: /std:c++17 /EHsc
        shell: pwsh
        run: |
          $configPath = Join-Path $env:RUNNER_TEMP "tauri-test-installer.json"
          Set-Content -Path $configPath -Value '{"bundle":{"createUpdaterArtifacts":false}}' -Encoding utf8
          pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis --config $configPath --ci

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "target\x86_64-pc-windows-msvc\release\bundle\nsis" -Filter "*.exe" |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if (!$installer) {
            Write-Error "Windows NSIS installer was not generated"
            exit 1
          }
          Write-Host "Installer: $($installer.FullName)"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DBX-mysql-tls-windows-x64-installer
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
